name: Build KIDORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build KIDORA Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kidora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter dependencies
        run: |
          echo "=== PUBSPEC ==="
          grep -A5 "dev_dependencies:" pubspec.yaml

          echo "=== PUB GET ==="
          flutter pub get

          echo "=== FLUTTER LINTS ==="
          flutter pub deps --style=compact | grep -i "flutter_lints" || true

          echo "=== DART TOOL PACKAGE CONFIG ==="
          if [ -f .dart_tool/package_config.json ]; then
            grep -i "flutter_lints" .dart_tool/package_config.json || true
          else
            echo "package_config.json NOT FOUND"
          fi

      - name: Analyze KIDORA
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIDORA-release-APK
          path: kidora/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
