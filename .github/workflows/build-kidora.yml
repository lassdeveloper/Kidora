name: Build KIDORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build KIDORA Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kidora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix SQLite imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repositories = [
              "badge_repository.dart",
              "daily_limit_repository.dart",
              "exercise_repository.dart",
              "lesson_repository.dart",
              "progress_repository.dart",
              "settings_repository.dart",
              "subject_repository.dart",
              "world_repository.dart",
          ]

          import_line = "import 'package:sqflite/sqflite.dart';\n"

          for filename in repositories:
              path = Path("lib/repositories") / filename
              content = path.read_text()

              if "ConflictAlgorithm" in content and "package:sqflite/sqflite.dart" not in content:
                  path.write_text(import_line + content)
                  print(f"Fixed: {path}")
              else:
                  print(f"OK: {path}")

          PY

      - name: Analyze KIDORA
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIDORA-release-APK
          path: kidora/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
