name: Build KIDORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build KIDORA Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kidora

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Verify flutter_lints
        run: flutter pub deps | grep flutter_lints

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload KIDORA APK
        uses: actions/upload-artifact@v7
        with:
          name: KIDORA-release-APK
          path: kidora/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
